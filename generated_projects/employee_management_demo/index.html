    <h2>Add Item</h2>

    <input id="name" placeholder="Enter Name">

    <button onclick="addItem()">
        Add
    </button>

    <script>

    async function addItem() {

        const name =
            document.getElementById("name").value;

        await fetch(
            "/items",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name
                })
            }
        );

        alert("Added");
    }

    </script>
