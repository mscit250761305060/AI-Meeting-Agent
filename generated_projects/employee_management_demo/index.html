
<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <h2>Features</h2>

    <ul>
        <li>Dashboard</li><li>Employee Management</li><li>Employee Form Management</li>
    </ul>

    <h2>Pages</h2>

    <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
<li><a href="employees.html">Employees</a></li>
<li><a href="employee_form.html">Employee Form</a></li>

    </ul>

    <h2>Add Item</h2>

    <input id="name" placeholder="Enter Name">

    <button onclick="addItem()">
        Add
    </button>

    <script>

    async function addItem() {

        const name =
            document.getElementById("name").value;

        await fetch(
            "/items",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name
                })
            }
        );

        alert("Added");
    }

    </script>

</body>
</html>
